<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HPC & MARBEC | Pailería y Herrería Industrial</title>
    
    <!-- Estilos y Frameworks -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --dark-ebony: #0a0a0a;
            --coffee-deep: #1a0f0a;
            --gold: #d4af37;
            --cream: #f4ece1;
        }
        
        body {
            background-color: var(--dark-ebony);
            color: var(--cream);
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
        }

        .bg-coffee { background-color: var(--coffee-deep); }
        .text-gold { color: var(--gold); }
        .border-gold { border-color: rgba(212, 175, 55, 0.3); }
        
        .btn-gold {
            background: linear-gradient(135deg, #d4af37 0%, #b08d4b 100%);
            color: #000;
            font-weight: 800;
            text-transform: uppercase;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-gold:hover {
            filter: brightness(1.1);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(212, 175, 55, 0.2);
        }

        .glass-nav {
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(212, 175, 55, 0.15);
        }

        .view-transition {
            animation: fadeIn 0.5s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Estilos de Formulario */
        input, textarea {
            background: rgba(255, 255, 255, 0.03) !important;
            border: 1px solid rgba(212, 175, 55, 0.1) !important;
            color: white !important;
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            width: 100%;
        }
        input:focus, textarea:focus {
            border-color: var(--gold) !important;
            outline: none;
        }
    </style>

    <!-- PayPal SDK -->
    <script src="https://www.paypal.com/sdk/js?client-id=SB_CLIENT_ID&currency=MXN"></script>
</head>
<body>

    <!-- Navegación -->
    <nav class="glass-nav sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex justify-between items-center">
            <div class="flex items-center cursor-pointer" onclick="app.navigate('inicio')">
                <i class="fas fa-fire-extinguisher text-3xl text-gold mr-3"></i>
                <div>
                    <h1 class="text-xl font-black tracking-widest leading-none text-white">HPC & <span class="text-gold">MARBEC</span></h1>
                    <span class="text-[9px] uppercase tracking-[0.4em] text-gray-500 font-bold">Pailería y Herrería</span>
                </div>
            </div>

            <div class="hidden lg:flex items-center space-x-8 text-[10px] font-black uppercase tracking-widest text-white">
                <button onclick="app.navigate('inicio')" class="hover:text-gold transition">Inicio</button>
                <button onclick="app.navigate('quienes_somos')" class="hover:text-gold transition">Quiénes Somos</button>
                <button onclick="app.navigate('mision_vision')" class="hover:text-gold transition">Filosofía</button>
                <button onclick="app.navigate('catalogo')" class="hover:text-gold transition">Catálogo</button>
                <button onclick="app.navigate('contacto')" class="hover:text-gold transition">Contacto</button>
                
                <div id="auth-status" class="flex items-center space-x-4 border-l border-white/10 pl-6">
                    <!-- Dinámico -->
                </div>
            </div>
        </div>
    </nav>

    <!-- Área de Contenido Dinámico -->
    <main id="app-viewport" class="min-h-[80vh]"></main>

    <!-- Footer -->
    <footer class="bg-black py-16 border-t border-white/5">
        <div class="max-w-7xl mx-auto px-6 text-center">
            <div class="flex justify-center space-x-8 mb-8 text-gray-500">
                <i class="fab fa-facebook-f hover:text-gold cursor-pointer transition"></i>
                <i class="fab fa-whatsapp hover:text-gold cursor-pointer transition"></i>
                <button onclick="app.navigate('privacidad')" class="hover:text-gold text-[10px] uppercase tracking-widest">Privacidad</button>
            </div>
            <p class="text-[9px] text-gray-600 tracking-[0.3em] uppercase">HPC & MARBEC © 2026 | Nicolás Romero, Estado de México | Especialistas en Seguridad Contra Incendio</p>
        </div>
    </footer>

    <!-- Lógica de Aplicación -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInAnonymously, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-analytics.js";

        // Credenciales Reales del Usuario
        const firebaseConfig = {
            apiKey: "AIzaSyCYL93Xg4wXL4AqkEJKxrsDLtykL0hPy6c",
            authDomain: "hpc--marbec.firebaseapp.com",
            projectId: "hpc--marbec",
            storageBucket: "hpc--marbec.firebasestorage.app",
            messagingSenderId: "444083999561",
            appId: "1:444083999561:web:de23baa9362942671e0098",
            measurementId: "G-1DX8SHV1YP"
        };

        // Inicializar Firebase
        const fbApp = initializeApp(firebaseConfig);
        const auth = getAuth(fbApp);
        const db = getFirestore(fbApp);
        const analytics = getAnalytics(fbApp);
        
        // El AppId para las rutas de Firestore será el mismo que el projectId por consistencia
        const appId = "hpc--marbec";

        // Estado Global de la App
        const state = {
            view: 'inicio',
            user: null,
            isAdmin: false,
            products: [],
            adminKey: "564879123@011@",
            whatsapp: "521234567890" 
        };

        // Router Interno
        window.app = {
            navigate: (v, params = null) => {
                state.view = v;
                state.params = params;
                render();
            },
            refresh: () => render()
        };

        // Escuchador de Autenticación
        onAuthStateChanged(auth, (u) => {
            state.user = u;
            updateUI();
            app.refresh();
        });

        window.toggleAdmin = () => {
            if(state.isAdmin) {
                state.isAdmin = false;
                alert("Modo Administrador Desactivado");
            } else {
                const key = prompt("CLAVE DE ACCESO ADMINISTRATIVO:");
                if(key === state.adminKey) {
                    state.isAdmin = true;
                    alert("ACCESO HPC-ADMIN CONCEDIDO");
                } else {
                    alert("CLAVE INCORRECTA");
                }
            }
            app.refresh();
        };

        // Plantillas de las Secciones
        const views = {
            inicio: () => `
                <div class="view-transition">
                    <section class="relative h-[85vh] flex items-center justify-center overflow-hidden">
                        <div class="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1504328345606-18bbc8c9d7d1?q=80&w=2000')] bg-cover bg-center opacity-10"></div>
                        <div class="relative z-10 text-center px-6">
                            <span class="text-gold tracking-[0.5em] text-[10px] font-black uppercase mb-6 block">Fabricación de Alta Resistencia</span>
                            <h2 class="text-6xl md:text-8xl font-black mb-8 leading-none">PAILERÍA<br><span class="text-gold">& HERRERÍA</span></h2>
                            <p class="max-w-xl mx-auto text-gray-400 text-sm leading-relaxed mb-10 italic">
                                Especialistas en gabinetes para extintores, mangueras, botes de arena y herrajes metálicos. Calidad industrial desde Nicolás Romero.
                            </p>
                            <button onclick="app.navigate('catalogo')" class="btn-gold px-12 py-5 rounded-full text-xs">Ver Catálogo Industrial</button>
                        </div>
                    </section>
                </div>
            `,
            quienes_somos: () => `
                <div class="view-transition py-24 max-w-5xl mx-auto px-6">
                    <h2 class="text-3xl font-black text-gold mb-12 tracking-widest text-center uppercase">Quiénes Somos</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-16 items-center">
                        <div class="space-y-6">
                            <p class="text-gray-400 leading-relaxed font-bold italic text-lg">HPC & MARBEC es una empresa orgullosamente mexiquense.</p>
                            <p class="text-gray-500 text-sm leading-relaxed">
                                Ubicados en la Colonia Independencia, Nicolás Romero, nos dedicamos a la transformación del metal para la seguridad. Nuestra experiencia en pailería y herrería nos permite fabricar piezas que resisten el paso del tiempo y protegen lo más valioso: la vida.
                            </p>
                        </div>
                        <div class="bg-coffee p-2 rounded-3xl border border-gold/20 shadow-2xl">
                            <div class="h-64 bg-black/40 rounded-2xl flex items-center justify-center text-gold italic">
                                Pailería & Herrería Técnica
                            </div>
                        </div>
                    </div>
                </div>
            `,
            mision_vision: () => `
                <div class="view-transition py-24 max-w-7xl mx-auto px-6">
                    <h2 class="text-3xl font-black text-center mb-20 tracking-widest uppercase">Filosofía <span class="text-gold">Corporativa</span></h2>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-10">
                        <div class="bg-coffee p-10 rounded-[40px] border border-white/5 shadow-xl">
                            <i class="fas fa-bullseye text-gold text-3xl mb-6"></i>
                            <h4 class="font-black text-xs uppercase tracking-widest mb-4">Misión</h4>
                            <p class="text-gray-500 text-xs leading-relaxed">Proveer equipos de seguridad contra incendio fabricados con excelencia técnica, garantizando la protección de inmuebles mediante productos metálicos duraderos.</p>
                        </div>
                        <div class="bg-coffee p-10 rounded-[40px] border border-gold/10 shadow-xl scale-105 bg-gradient-to-b from-transparent to-gold/5">
                            <i class="fas fa-eye text-gold text-3xl mb-6"></i>
                            <h4 class="font-black text-xs uppercase tracking-widest mb-4">Visión</h4>
                            <p class="text-gray-500 text-xs leading-relaxed">Consolidarnos como el fabricante de referencia en el Estado de México para el año 2028, destacando por nuestra precisión en pailería.</p>
                        </div>
                        <div class="bg-coffee p-10 rounded-[40px] border border-white/5 shadow-xl">
                            <i class="fas fa-award text-gold text-3xl mb-6"></i>
                            <h4 class="font-black text-xs uppercase tracking-widest mb-4">Política de Calidad</h4>
                            <p class="text-gray-500 text-xs leading-relaxed">Mejora continua en nuestros procesos de herrería para que cada gabinete cumpla con las normas de seguridad vigentes.</p>
                        </div>
                    </div>
                </div>
            `,
            catalogo: () => `
                <div class="view-transition py-20 max-w-7xl mx-auto px-6">
                    <div class="flex justify-between items-end mb-16">
                        <div>
                            <h2 class="text-4xl font-black tracking-widest">PRODUCTOS <span class="text-gold">METÁLICOS</span></h2>
                            <p class="text-gray-600 text-[10px] font-bold uppercase tracking-[0.3em] mt-2">Equipamiento Contra Incendio Profesional</p>
                        </div>
                        <div class="flex gap-4">
                            <button onclick="toggleAdmin()" class="bg-white/5 p-4 rounded-xl border border-white/10 hover:border-gold/50 transition">
                                <i class="${state.isAdmin ? 'fas fa-lock-open text-gold' : 'fas fa-lock text-gray-600'}"></i>
                            </button>
                            ${state.isAdmin ? `<button onclick="app.navigate('admin_add')" class="btn-gold px-8 py-4 rounded-xl text-[10px]">Añadir Producto</button>` : ''}
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-10">
                        ${state.products.length === 0 ? '<p class="text-gray-600 col-span-3 text-center py-20 italic">Cargando catálogo...</p>' : ''}
                        ${state.products.map(p => `
                            <div class="bg-coffee rounded-[32px] overflow-hidden border border-white/5 hover:border-gold/40 transition-all duration-500 group">
                                <div class="h-64 bg-black relative">
                                    <img src="${p.image || 'https://via.placeholder.com/500?text=HPC+MARBEC'}" class="w-full h-full object-cover group-hover:scale-105 transition duration-700 opacity-80">
                                    <div class="absolute top-6 right-6 bg-black/90 px-4 py-1 rounded-full border border-gold/30">
                                        <span class="text-gold font-black text-xs">$${p.price} MXN</span>
                                    </div>
                                </div>
                                <div class="p-8">
                                    <h3 class="text-lg font-black uppercase tracking-wider mb-2 text-white">${p.name}</h3>
                                    <p class="text-gray-500 text-[11px] leading-relaxed mb-8 h-10 overflow-hidden">${p.description}</p>
                                    <button onclick="app.navigate('checkout', '${p.id}')" class="w-full border border-gold/40 text-gold py-4 rounded-2xl text-[10px] font-black uppercase tracking-widest hover:bg-gold hover:text-black transition">Adquirir Ahora</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `,
            admin_add: () => `
                <div class="view-transition py-20 max-w-xl mx-auto px-6">
                    <div class="bg-coffee p-10 rounded-[40px] border border-gold/20 shadow-2xl">
                        <h2 class="text-2xl font-black text-center mb-8 tracking-widest uppercase text-gold">Registrar Equipo</h2>
                        <div class="space-y-6">
                            <input id="p-name" type="text" placeholder="Nombre (Ej: Gabinete Tipo Manguera)">
                            <input id="p-price" type="number" placeholder="Precio MXN">
                            <input id="p-img" type="text" placeholder="URL Imagen (Link)">
                            <textarea id="p-desc" rows="4" placeholder="Especificaciones Técnicas (Calibre, medidas...)"></textarea>
                            <button onclick="saveProduct()" class="w-full btn-gold py-5 rounded-2xl text-[10px]">Publicar en Catálogo</button>
                            <button onclick="app.navigate('catalogo')" class="w-full text-gray-500 text-[10px] font-bold uppercase text-center mt-4">Cancelar</button>
                        </div>
                    </div>
                </div>
            `,
            contacto: () => `
                <div class="view-transition py-24 max-w-4xl mx-auto px-6">
                    <div class="text-center mb-20">
                        <h2 class="text-4xl font-black mb-4 uppercase tracking-widest">Contacto <span class="text-gold">Directo</span></h2>
                        <p class="text-gray-500 text-xs italic tracking-widest uppercase">Atención a Constructoras y Protección Civil</p>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-16">
                        <div class="space-y-10">
                            <div class="flex items-center space-x-6">
                                <i class="fas fa-map-marked-alt text-gold text-2xl w-12 h-12 flex items-center justify-center bg-gold/10 rounded-full"></i>
                                <div>
                                    <h5 class="font-bold text-sm uppercase">Planta de Fabricación</h5>
                                    <p class="text-gray-500 text-xs">Col. Independencia, Nicolás Romero, Edo. Méx.</p>
                                </div>
                            </div>
                            <div class="flex items-center space-x-6">
                                <i class="fab fa-whatsapp text-gold text-2xl w-12 h-12 flex items-center justify-center bg-gold/10 rounded-full"></i>
                                <div>
                                    <h5 class="font-bold text-sm uppercase">Atención WhatsApp</h5>
                                    <p class="text-gray-500 text-xs tracking-widest">+52 1 234 567 890</p>
                                </div>
                            </div>
                        </div>
                        <div class="bg-coffee p-10 rounded-[40px] border border-white/5">
                            <input type="text" placeholder="Empresa / Particular" class="mb-4">
                            <textarea rows="4" placeholder="Requerimiento técnico..." class="mb-6"></textarea>
                            <button class="w-full btn-gold py-4 rounded-xl text-[10px]">Enviar Mensaje</button>
                        </div>
                    </div>
                </div>
            `,
            checkout: (pId) => {
                const p = state.products.find(x => x.id === pId);
                if(!p) return `<p class="py-40 text-center italic text-gray-500">Cargando detalles...</p>`;
                return `
                    <div class="view-transition py-24 max-w-xl mx-auto px-6 text-center">
                        <h2 class="text-3xl font-black mb-10 tracking-widest uppercase">Resumen de <span class="text-gold">Adquisición</span></h2>
                        <div class="bg-coffee p-10 rounded-[40px] border border-gold/10 space-y-8">
                            <div class="flex justify-between items-center pb-8 border-b border-white/10">
                                <div class="text-left">
                                    <p class="font-black text-xl uppercase">${p.name}</p>
                                </div>
                                <p class="text-gold font-black text-2xl">$${p.price}</p>
                            </div>
                            <div id="paypal-container"></div>
                        </div>
                    </div>
                `;
            },
            privacidad: () => `
                <div class="view-transition py-24 max-w-3xl mx-auto px-6 text-gray-500 text-xs leading-relaxed">
                    <h2 class="text-2xl font-black text-white mb-8 tracking-widest uppercase">Aviso de <span class="text-gold">Privacidad</span></h2>
                    <p class="mb-6">HPC & MARBEC con domicilio en Nicolás Romero, Estado de México, es responsable del tratamiento de sus datos para fines de cotización y entrega.</p>
                    <button onclick="app.navigate('inicio')" class="text-gold font-bold">Volver al inicio</button>
                </div>
            `
        };

        // Renderizado del Viewport
        function render() {
            const viewport = document.getElementById('app-viewport');
            viewport.innerHTML = views[state.view](state.params);
            if(state.view === 'checkout') initPayPal(state.params);
        }

        function updateUI() {
            const bar = document.getElementById('auth-status');
            if(state.user && !state.user.isAnonymous) {
                bar.innerHTML = `
                    <span class="text-[10px] text-white font-black">${state.user.email}</span>
                    <button onclick="logout()" class="text-red-500 ml-4"><i class="fas fa-power-off"></i></button>
                `;
            } else {
                bar.innerHTML = `<button onclick="toggleAdmin()" class="text-gold text-[9px] font-bold border border-gold/30 px-4 py-1 rounded-full">ADMIN</button>`;
            }
        }

        // PayPal
        function initPayPal(pId) {
            const p = state.products.find(x => x.id === pId);
            if(!p || !window.paypal) return;
            paypal.Buttons({
                createOrder: (data, actions) => actions.order.create({
                    purchase_units: [{ amount: { value: p.price.toString(), currency_code: 'MXN' }, description: p.name }]
                }),
                onApprove: async (data, actions) => {
                    const order = await actions.order.capture();
                    await finalizeOrder(order, p);
                }
            }).render('#paypal-container');
        }

        async function finalizeOrder(order, p) {
            const data = {
                orderId: order.id,
                product: p.name,
                total: p.price,
                timestamp: serverTimestamp()
            };
            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'payments'), data);
            
            const msg = encodeURIComponent(`¡HOLA HPC & MARBEC!\nAcabo de pagar $${p.price} por el equipo: ${p.name}.\nID de Orden: ${order.id}.\nFavor de coordinar entrega en la Col. Independencia.`);
            window.open(`https://wa.me/${state.whatsapp}?text=${msg}`, '_blank');
            app.navigate('inicio');
            alert("¡PAGO EXITOSO!");
        }

        // Acciones Admin
        window.saveProduct = async () => {
            const name = document.getElementById('p-name').value;
            const price = document.getElementById('p-price').value;
            const img = document.getElementById('p-img').value;
            const desc = document.getElementById('p-desc').value;

            if(!name || !price) return alert("Faltan datos");

            try {
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'products'), {
                    name, price: parseFloat(price), image: img, description: desc, createdAt: serverTimestamp()
                });
                alert("Producto añadido.");
                app.navigate('catalogo');
            } catch (e) { console.error(e); }
        };

        window.logout = () => signOut(auth);

        // Firestore Listeners
        onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'products'), (snap) => {
            state.products = snap.docs.map(d => ({id: d.id, ...d.data()}));
            if(state.view === 'catalogo') render();
        });

        // Inicialización
        window.onload = async () => {
            await signInAnonymously(auth);
            app.navigate('inicio');
        };

    </script>
</body>
</html>
