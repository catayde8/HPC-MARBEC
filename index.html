<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HPC & MARBEC | Pailería y Herrería Industrial</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --dark-ebony: #0a0a0a;
            --coffee-deep: #1a0f0a;
            --gold: #d4af37;
            --cream: #f4ece1;
        }
        body { background-color: var(--dark-ebony); color: var(--cream); font-family: 'Inter', sans-serif; }
        .bg-coffee { background-color: var(--coffee-deep); }
        .text-gold { color: var(--gold); }
        .btn-gold {
            background: linear-gradient(135deg, #d4af37 0%, #b08d4b 100%);
            color: #000; font-weight: 800; text-transform: uppercase;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-gold:hover { filter: brightness(1.1); transform: translateY(-2px); }
        .glass-nav { background: rgba(10, 10, 10, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(212, 175, 55, 0.15); }
        input, textarea {
            background: rgba(255, 255, 255, 0.03) !important;
            border: 1px solid rgba(212, 175, 55, 0.1) !important;
            color: white !important; padding: 0.75rem 1rem; border-radius: 0.75rem; width: 100%;
        }
        /* Loader simple */
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #d4af37;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>

    <script src="https://www.paypal.com/sdk/js?client-id=SB_CLIENT_ID&currency=MXN"></script>
</head>
<body>

    <nav class="glass-nav sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex justify-between items-center">
            <div class="flex items-center cursor-pointer" onclick="app.navigate('inicio')">
                <i class="fas fa-fire-extinguisher text-3xl text-gold mr-3"></i>
                <h1 class="text-xl font-black tracking-widest leading-none text-white">HPC & <span class="text-gold">MARBEC</span></h1>
            </div>
            <div class="hidden lg:flex items-center space-x-8 text-[10px] font-black uppercase tracking-widest text-white">
                <button onclick="app.navigate('inicio')">Inicio</button>
                <button onclick="app.navigate('quienes_somos')">Quiénes Somos</button>
                <button onclick="app.navigate('catalogo')">Catálogo</button>
                <button onclick="app.navigate('contacto')">Contacto</button>
                <div id="auth-status"></div>
            </div>
        </div>
    </nav>

    <main id="app-viewport" class="min-h-[80vh]"></main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Tu configuración de Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyCYL93Xg4wXL4AqkEJKxrsDLtykL0hPy6c",
            authDomain: "hpc--marbec.firebaseapp.com",
            projectId: "hpc--marbec",
            storageBucket: "hpc--marbec.firebasestorage.app",
            messagingSenderId: "444083999561",
            appId: "1:444083999561:web:de23baa9362942671e0098"
        };

        const fbApp = initializeApp(firebaseConfig);
        const auth = getAuth(fbApp);
        const db = getFirestore(fbApp);

        const state = { view: 'inicio', products: [], isAdmin: false, adminKey: "564879123@011@" };

        window.app = { 
            navigate: (v, p) => { 
                state.view = v; 
                state.params = p; 
                render(); 
            } 
        };

        onAuthStateChanged(auth, (u) => { 
            updateUI(); 
            // Solo navegar al inicio si es la primera carga
            if(!state.initialLoad) {
                state.initialLoad = true;
                app.navigate('inicio'); 
            }
        });

        const views = {
            inicio: () => `<div class="py-40 text-center animate-pulse">
                <h2 class="text-6xl font-black mb-6">PAILERÍA <span class="text-gold">INDUSTRIAL</span></h2>
                <p class="text-gray-500 mb-10 max-w-lg mx-auto uppercase tracking-widest text-xs">Fabricación y distribución en Nicolás Romero, Edo. Méx.</p>
                <button onclick="app.navigate('catalogo')" class="btn-gold px-12 py-4 rounded-full">Ver Productos</button>
            </div>`,
            catalogo: () => `
                <div class="py-20 max-w-7xl mx-auto px-6">
                    <div class="flex justify-between items-center mb-10">
                        <h2 class="text-3xl font-black uppercase">Catálogo <span class="text-gold">HPC</span></h2>
                        <div class="flex gap-4">
                            ${state.isAdmin ? `<button onclick="app.navigate('admin_add')" class="btn-gold px-6 py-2 rounded-xl text-xs">Nuevo Producto</button>` : `<button onclick="toggleAdmin()" class="text-gray-600 text-xs hover:text-gold transition"><i class="fas fa-lock mr-2"></i>Admin</button>`}
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                        ${state.products.length === 0 ? '<div class="col-span-3 text-center text-gray-600 py-10">Cargando inventario...</div>' : ''}
                        ${state.products.map(p => `
                            <div class="bg-coffee p-6 rounded-[2.5rem] border border-white/5 hover:border-gold/30 transition-all group">
                                <div class="relative h-48 mb-6 overflow-hidden rounded-2xl bg-black flex items-center justify-center">
                                    <img src="${p.image}" class="w-full h-full object-cover opacity-80 group-hover:opacity-100 transition-opacity">
                                    <div class="absolute top-4 right-4 bg-black/80 px-3 py-1 rounded-full border border-gold/30 text-[10px] font-bold text-gold">
                                        $${p.price} MXN
                                    </div>
                                </div>
                                <h3 class="font-black uppercase tracking-wider mb-2 text-white">${p.name}</h3>
                                <p class="text-gray-500 text-[10px] leading-relaxed mb-6 h-12 overflow-hidden">${p.description || 'Equipo industrial de alta resistencia.'}</p>
                                <button class="w-full border border-gold text-gold py-3 rounded-xl text-[10px] font-black uppercase tracking-widest hover:bg-gold hover:text-black transition">Comprar</button>
                            </div>
                        `).join('')}
                    </div>
                </div>`,
            admin_add: () => `
                <div class="py-20 max-w-md mx-auto px-6">
                    <div class="bg-coffee p-10 rounded-[2.5rem] border border-gold/20 shadow-2xl">
                        <h2 class="text-xl font-black text-center mb-8 uppercase text-gold">Registrar Equipo</h2>
                        <div class="space-y-4">
                            <input id="p-name" type="text" placeholder="Nombre (Ej: Gabinete Tipo Manguera)">
                            <input id="p-price" type="number" placeholder="Precio MXN">
                            <textarea id="p-desc" placeholder="Descripción y medidas del producto"></textarea>
                            
                            <div class="bg-black/40 p-4 rounded-xl border border-dashed border-gold/20">
                                <div class="text-[10px] text-gold font-bold mb-3 uppercase tracking-widest">Foto del producto:</div>
                                <input id="p-file" type="file" accept="image/*" class="text-[10px] file:bg-gold file:border-none file:px-4 file:py-1 file:rounded-full file:mr-4 file:cursor-pointer file:font-bold">
                            </div>
                            
                            <button id="btn-save" onclick="saveProduct()" class="w-full btn-gold py-5 rounded-2xl text-[10px] font-black tracking-widest mt-4 shadow-xl">
                                Guardar en Base de Datos
                            </button>
                            <button onclick="app.navigate('catalogo')" class="w-full text-gray-600 text-[9px] uppercase font-bold tracking-widest mt-2">Cancelar</button>
                        </div>
                    </div>
                </div>`
        };

        // Función para convertir imagen a Base64
        const fileToBase64 = (file) => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });

        window.saveProduct = async () => {
            const fileInput = document.getElementById('p-file');
            const file = fileInput.files[0];
            const name = document.getElementById('p-name').value;
            const price = document.getElementById('p-price').value;
            const desc = document.getElementById('p-desc').value;
            const btn = document.getElementById('btn-save');

            if(!file || !name || !price) return alert("Por favor completa los campos y selecciona una imagen.");

            // Validar tamaño (Base64 aumenta el peso, Firestore limita a 1MB por documento)
            if(file.size > 800 * 1024) { // Límite recomendado ~800KB para evitar el 1MB de Firestore
                return alert("La imagen es muy pesada. Por favor usa una de menos de 800KB.");
            }

            btn.innerHTML = '<div class="loader"></div> PROCESANDO...';
            btn.disabled = true;

            try {
                // 1. Convertir a Base64 directamente (Sin Storage)
                const base64Image = await fileToBase64(file);

                // 2. Guardar en Firestore
                await addDoc(collection(db, 'products'), {
                    name, 
                    price: parseFloat(price), 
                    description: desc, 
                    image: base64Image, 
                    createdAt: serverTimestamp()
                });

                alert("¡Equipo guardado con éxito!");
                app.navigate('catalogo');
            } catch (e) {
                console.error(e);
                alert("Error al guardar: " + e.message);
            } finally {
                btn.innerHTML = 'GUARDAR EN BASE DE DATOS';
                btn.disabled = false;
            }
        };

        window.toggleAdmin = () => {
            const key = prompt("CLAVE DE ACCESO:");
            if(key === state.adminKey) { 
                state.isAdmin = true; 
                app.navigate('catalogo'); 
            } else {
                alert("Clave incorrecta");
            }
        };

        function render() { 
            const viewport = document.getElementById('app-viewport');
            viewport.innerHTML = (views[state.view] || views.inicio)(); 
        }
        
        function updateUI() {
            const status = document.getElementById('auth-status');
            status.innerHTML = state.isAdmin ? '<div class="bg-gold/10 text-gold px-3 py-1 rounded-full text-[9px] font-black border border-gold/20">HPC-ADMIN</div>' : '';
        }

        // Listener en tiempo real de Firestore
        onSnapshot(collection(db, 'products'), (snap) => {
            state.products = snap.docs.map(d => ({id: d.id, ...d.data()}));
            if(state.view === 'catalogo') render();
        });

        window.onload = async () => { 
            await signInAnonymously(auth); 
            render(); 
        };
    </script>
</body>
</html>
